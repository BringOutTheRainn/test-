name: Android build

# Builds an installable debug APK and attaches it to the run as an artifact
# ("stardust-empire-apk"). Download it from the run's Summary page.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
      - name: Build the web game
        run: npm run build
      - name: Restore the Play signing key, if the repository has one
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
      - name: Build the APK (and a signed bundle when a key is set)
        # The Ubuntu runner already has the Android SDK at $ANDROID_HOME.
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash tools/android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stardust-empire-apk
          path: build/stardust-empire.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: stardust-empire-play-bundle
          path: build/stardust-empire.aab
          if-no-files-found: ignore
