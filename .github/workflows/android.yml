name: Android build

# Builds an installable debug APK and attaches it to the run as an artifact
# ("stardust-empire-apk"). Download it from the run's Summary page.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
      - name: Build the web game
        run: npm run build
      - name: Build the APK
        # The Ubuntu runner already has the Android SDK at $ANDROID_HOME.
        run: bash tools/android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stardust-empire-apk
          path: build/stardust-empire.apk
          if-no-files-found: error
