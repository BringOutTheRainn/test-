name: Emberdeep Android build

# Builds an installable debug APK of Emberdeep and attaches it to the run as the
# "emberdeep-apk" artifact. Download it from the run's Summary page.
on:
  push:
    branches: [main]
    paths: ['rpg/**', '.github/workflows/rpg-android.yml']
  pull_request:
    paths: ['rpg/**', '.github/workflows/rpg-android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rpg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
      - name: Build the APK
        # The Ubuntu runner already has the Android SDK at $ANDROID_HOME.
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: npm run android
      - uses: actions/upload-artifact@v4
        with:
          name: emberdeep-apk
          path: rpg/build/emberdeep.apk
          if-no-files-found: error
