// Builds the CityNotifications Android plugin as an AAR. The Android
// workflow runs `gradle assembleRelease` here and copies the result into
// addons/city_notifications/bin/, where the export plugin picks it up.
plugins {
    id 'com.android.library' version '8.2.2'
}

android {
    namespace 'com.bringouttherainn.notifications'
    compileSdk 34
    defaultConfig {
        minSdk 21
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Provided by the game at runtime; only needed to compile against.
    compileOnly 'org.godotengine:godot:4.3.0.stable'
}
